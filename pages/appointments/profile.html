<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hospital Islam Azzahrah - Patient Profile</title>
  <link rel="stylesheet" href="/styles/styles.css" />
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://kit.fontawesome.com/d29bed84f6.js" crossorigin="anonymous"></script>
  <script src="../../scripts/load-page.js"></script>
  <script src="../../scripts/patient-profile.js"></script>
</head>
<body>
  <div id="container">
    <main>
      <header>
        <h1>My Profile</h1>
        <p id="role-view"></p>
      </header>
      <div id="content">
        <input type="hidden" value="patient" id="role" name="role" />

        <div id="view-section">
          <div class="card">
            <div class="profile-header">
              <div class="profile-avatar"></div>
              <div>
                <h2 id="profile-name">Patient Name</h2>
                <span class="profile-badge"><i class="fa-regular fa-id-card"></i> Patient ID: P-10234</span>
              </div>
            </div>

            <div class="info-row">
              <div class="info-label"><i class="fa-regular fa-envelope"></i> Email Address</div>
              <div class="info-value" id="display-email">—</div>
            </div>
            <div class="info-row">
              <div class="info-label"><i class="fa-solid fa-phone"></i> Phone Number</div>
              <div class="info-value" id="display-phone">—</div>
            </div>
            <div class="info-row">
              <div class="info-label"><i class="fa-regular fa-address-card"></i> IC / Passport</div>
              <div class="info-value" id="display-ic">—</div>
            </div>
            <div class="info-row">
              <div class="info-label"><i class="fa-regular fa-cake-candles"></i> Date of Birth</div>
              <div class="info-value" id="display-dob">—</div>
            </div>
            <div class="info-row">
              <div class="info-label"><i class="fa-solid fa-droplet"></i> Blood Type</div>
              <div class="info-value" id="display-blood">—</div>
            </div>
            <div class="info-row">
              <div class="info-label"><i class="fa-solid fa-phone-volume"></i> Emergency Contact</div>
              <div class="info-value" id="display-emergency">—</div>
            </div>
            <div class="info-row">
              <div class="info-label"><i class="fa-solid fa-handshake"></i> Relationship</div>
              <div class="info-value" id="display-emergencyRelation">—</div>
            </div>
            <div class="info-row">
              <div class="info-label"><i class="fa-solid fa-location-dot"></i> Address</div>
              <div class="info-value" id="display-address">—</div>
            </div>

            <div class="medical-badge">
              <i class="fa-solid fa-hospital-user"></i> <strong>Medical Information</strong>
            </div>
            
            <div class="info-row">
              <div class="info-label"><i class="fa-solid fa-allergies"></i> Allergies</div>
              <div class="info-value" id="display-allergies">—</div>
            </div>
            <div class="info-row">
              <div class="info-label"><i class="fa-solid fa-user-doctor"></i> Primary Doctor</div>
              <div class="info-value" id="display-primaryDoctor">—</div>
            </div>
            <div class="info-row">
              <div class="info-label"><i class="fa-solid fa-notes-medical"></i> Medical History</div>
              <div class="info-value" id="display-medicalHistory">—</div>
            </div>
            <div class="info-row">
              <div class="info-label"><i class="fa-solid fa-file-invoice"></i> Insurance</div>
              <div class="info-value" id="display-insurance">—</div>
            </div>
            <div class="info-row">
              <div class="info-label"><i class="fa-regular fa-note-sticky"></i> Additional Notes</div>
              <div class="info-value" id="display-bio">—</div>
            </div>

            <div class="profile-actions">
              <button class="btn btn-info" id="edit-btn"><i class="fa-regular fa-pen-to-square"></i> Edit Profile</button>
            </div>
          </div>
        </div>

        <div class="edit-section card">
          <h3><i class="fa-regular fa-pen-to-square"></i> Edit Profile</h3>
          <div class="form-row">
            <label>Full Name</label>
            <input type="text" id="edit-fullname" class="form-control">
          </div>
          <div class="form-row">
            <label>Email Address</label>
            <input type="email" id="edit-email" class="form-control">
          </div>
          <div class="form-row">
            <label>Phone Number</label>
            <input type="text" id="edit-phone" class="form-control">
          </div>
          <div class="form-row">
            <label>Address</label>
            <input type="text" id="edit-address" class="form-control">
          </div>
          <div class="form-row">
            <label>Emergency Contact (Name & Phone)</label>
            <input type="text" id="edit-emergencyContact" class="form-control">
          </div>
          <div class="form-row">
            <label>Allergies</label>
            <input type="text" id="edit-allergies" class="form-control">
          </div>
          <div class="form-row">
            <label>Additional Notes</label>
            <textarea id="edit-bio" rows="3" class="form-control"></textarea>
          </div>
          <div class="profile-actions">
            <button class="btn btn-secondary" id="cancel-btn">Cancel</button>
            <button class="btn btn-success" id="save-btn"><i class="fa-regular fa-floppy-disk"></i> Save Changes</button>
          </div>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
